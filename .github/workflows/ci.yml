name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make build
      - run: make test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Test-results
          path: /private/tmp/PulseDerivedData/Logs/Test/*.xcresult
